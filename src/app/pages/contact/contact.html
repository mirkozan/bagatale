<div class="container">
  <section class="page-intro">
    <div class="eyebrow">{{ i18n.t('contact.eyebrow') }}</div>
    <h1>{{ i18n.t('contact.title') }}</h1>
    <p>{{ i18n.t('contact.lead') }}</p>
  </section>
  <section class="contact-section section">
    <div class="contact-aside">
      <div class="contact-orb">✳</div>
      <p>hello&#64;bagatale.hu<br>Budapest, HU</p>
    </div>
    <div class="form-wrap">
      @if (sent()) {
        <div class="success">{{ i18n.t('contact.success') }}</div>
      } @else {
        <form name="contact" method="POST" action="/contact" data-netlify="true" data-netlify-honeypot="bot-field" (ngSubmit)="submitted($event)">
          <input type="hidden" name="form-name" value="contact">
          <input type="hidden" name="bot-field">
          <label>{{ i18n.t('contact.name') }}<input name="name" type="text" required></label>
          <label>{{ i18n.t('contact.email') }}<input name="email" type="email" required></label>
          <label>{{ i18n.t('contact.message') }}<textarea name="message" rows="6" required></textarea></label>
          <button class="btn btn-primary" type="submit">{{ i18n.t('contact.send') }} <span>↗</span></button>
        </form>
      }
    </div>
  </section>
</div>
