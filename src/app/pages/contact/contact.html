<div class="container">  <section class="page-intro">    <div class="eyebrow">{{ i18n.t('contact.eyebrow') }}</div>    <h1>{{ i18n.t('contact.title') }}</h1>    <p>{{ i18n.t('contact.lead') }}</p>  </section>  <section class="contact-section section">    <div class="contact-aside">      <img class="contact-orb" src="/images/contact_image.JPG" alt="">      <p><a href="mailto:bagatale.hello@gmail.com">bagatale.hello&#64;gmail.com</a><br>Pécs, HU</p>    </div>    <div class="form-wrap">      @if (isSent) {        <div class="success">{{ i18n.t('contact.success') }}</div>      } @else { @if (hasError) { <div class="error">{{ errorMessage }}</div> }        <form name="contact" method="POST" action="https://formsubmit.co/ajax/bagatale.hello@gmail.com" (ngSubmit)="submitted($event)">          <input type="hidden" name="_subject" value="New Bagatale contact message"><input type="hidden" name="_captcha" value="false">          <label>{{ i18n.t('contact.name') }}<input name="name" type="text" required></label>          <label>{{ i18n.t('contact.email') }}<input name="email" type="email" required pattern="[^\s@]+@[^\s@]+\.[^\s@]+" title="Please enter an email like name@domain.com"></label>          <label>{{ i18n.t('contact.message') }}<textarea name="message" rows="6" required></textarea></label>          <button class="btn btn-primary" type="submit">{{ i18n.t('contact.send') }} <span>↗</span></button>        </form>      }    </div>  </section></div>
